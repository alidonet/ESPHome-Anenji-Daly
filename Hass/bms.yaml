# Default entity IDs. Adjust them if renamed in Home Assistant.
# This example displays eight cells. Adjust cellCount and the cell graph for a different pack.
type: sections
max_columns: 3
title: Daly BMS
path: daly
sections:
  - type: grid
    cards:
      - type: heading
        heading: Батарея
        icon: mdi:battery
      - type: custom:jk-bms-card
        prefix: daly
        title: Daly BMS
        layout: core-reactor
        cellCount: 8
        cellColumns: 2
        cellLayout: bankMode
        cellColorMode: progress
        maxCellVoltage: 3.7
        tempSensorsCount: 1
        hasHeater: false
        entities:
          delta_cell_voltage: sensor.daly_cell_spread
          balancing: binary_sensor.daly_balancing
          balancing_current: sensor.daly_balance_current
          power: sensor.daly_power
          charging: binary_sensor.daly_charging
          charging_power: sensor.daly_charging_power
          discharging: binary_sensor.daly_discharging
          discharging_power: sensor.daly_discharging_power
          balancer: switch.daly_balancer
          total_voltage: sensor.daly_voltage
          average_cell_voltage: sensor.daly_average_cell_voltage
          current: sensor.daly_current
          state_of_charge: sensor.daly_soc
          capacity_remaining: sensor.daly_remaining_capacity
          charging_cycles: sensor.daly_charge_cycles
          power_tube_temperature: sensor.daly_mosfet_temperature
          temperature_sensor_1: sensor.daly_temperature
          min_voltage_cell: sensor.daly_lowest_cell_number
          max_voltage_cell: sensor.daly_highest_cell_number
          min_cell_voltage: sensor.daly_min_cell_voltage
          max_cell_voltage: sensor.daly_max_cell_voltage
          errors: sensor.daly_errors
          cell_prefix: sensor.daly_cell_
        grid_options:
          columns: full
      - type: entities
        title: Диагностика Daly
        show_header_toggle: false
        entities:
          - entity: sensor.daly_remaining_capacity
            name: Остаток ёмкости
          - entity: sensor.daly_charge_cycles
            name: Циклы заряда
          - entity: switch.daly_balancer
            name: Балансир
          - type: button
            entity: button.daly_restart
            name: Перезапустить BMS
            action_name: Перезапустить
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.daly_restart
              confirmation:
                text: Перезапустить Daly BMS?
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: История за 24 часа
        icon: mdi:chart-line
      - type: history-graph
        title: Связь и состояние
        hours_to_show: 24
        entities:
          - entity: binary_sensor.daly_online
            name: Связь
          - entity: sensor.daly_status
            name: Состояние
          - entity: binary_sensor.daly_balancing
            name: Балансировка
        grid_options:
          columns: full
      - type: history-graph
        title: Заряд батареи
        hours_to_show: 24
        entities:
          - entity: sensor.daly_soc
            name: Заряд
      - type: history-graph
        title: Мощность батареи
        hours_to_show: 24
        entities:
          - entity: sensor.daly_power
            name: Батарея
      - type: history-graph
        title: Ток батареи
        hours_to_show: 24
        entities:
          - entity: sensor.daly_current
            name: Ток
      - type: history-graph
        title: Напряжение батареи
        hours_to_show: 24
        entities:
          - entity: sensor.daly_voltage
            name: Напряжение
      - type: history-graph
        title: Температура
        hours_to_show: 24
        entities:
          - entity: sensor.daly_temperature
            name: Батарея
          # MOSFET and board temperatures require the 80-register Daly reply.
          - entity: sensor.daly_mosfet_temperature
            name: MOSFET
          - entity: sensor.daly_board_temperature
            name: Плата
      - type: history-graph
        title: Разброс ячеек
        hours_to_show: 24
        entities:
          - entity: sensor.daly_cell_spread
            name: Макс. − мин.
      - type: history-graph
        title: Напряжение ячеек
        hours_to_show: 24
        entities:
          - entity: sensor.daly_average_cell_voltage
            name: Среднее
          - entity: sensor.daly_cell_1
            name: Ячейка 1
          - entity: sensor.daly_cell_2
            name: Ячейка 2
          - entity: sensor.daly_cell_3
            name: Ячейка 3
          - entity: sensor.daly_cell_4
            name: Ячейка 4
          - entity: sensor.daly_cell_5
            name: Ячейка 5
          - entity: sensor.daly_cell_6
            name: Ячейка 6
          - entity: sensor.daly_cell_7
            name: Ячейка 7
          - entity: sensor.daly_cell_8
            name: Ячейка 8
        grid_options:
          columns: full
badges:
  - type: entity
    entity: binary_sensor.daly_online
    name: Связь с Daly
    show_name: true
  - type: entity
    entity: sensor.daly_status
    name: Состояние
    show_name: true
  - type: entity
    entity: sensor.daly_soc
    name: Заряд
    show_name: true
  - type: entity
    entity: sensor.daly_cell_spread
    name: Разброс ячеек
    show_name: true
  - type: entity
    entity: sensor.daly_errors
    name: Ошибки
    show_name: true
header:
  layout: center
  badges_position: top
  badges_wrap: wrap
cards: []
