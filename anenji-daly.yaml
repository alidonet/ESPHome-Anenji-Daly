substitutions:
  device_description: "Monitor a DALY BMS via BLE and Anenji Inverter via modbus (RS485)"
  external_components_source: github://syssi/esphome-daly-bms@7a78b6ba49bd5e2efad6ffcbe6c04bbf4082f2cf
  refresh_bms: 30s
  refresh_inverter: 20s
  tx_pin: GPIO16
  rx_pin: GPIO17
  timezone: Etc/UTC

globals:
  # A single formatter shared by all text sensor filters.
  - id: translate_state
    type: std::string (*)(std::string_view, bool, bool)
    initial_value: |-
      +[](std::string_view text, bool russian, bool is_list) -> std::string {
        struct Translation {
          std::string_view english;
          std::string_view russian;
        };

        static constexpr Translation translations[] = {
            // Inverter fault and warning labels.
            {"Output short circuit", "КЗ на выходе"},
            {"Battery overvoltage", "Перенапряжение батареи"},
            {"Battery overcurrent", "Сверхток батареи"},
            {"DC bus overvoltage", "Перенапряжение шины DC"},
            {"Inverter overvoltage", "Перенапряжение инвертора"},
            {"Inverter overcurrent", "Сверхток инвертора"},
            {"PV overvoltage", "Перенапряжение PV"},
            {"PV overcurrent", "Сверхток PV"},
            {"Inverter overheat", "Перегрев инвертора"},
            {"DC/DC overheat", "Перегрев DC/DC"},
            {"PV overheat", "Перегрев PV"},
            {"Output overload", "Перегрузка выхода"},
            {"Excess inverter DC offset", "Постоянная составляющая инвертора"},
            {"DC bus undervoltage", "Низкое напряжение шины DC"},
            {"Inverter undervoltage", "Низкое напряжение инвертора"},
            {"Reverse inverter power", "Обратная мощность инвертора"},
            {"DC bus start timeout", "Таймаут пуска шины DC"},
            {"Incompatible battery", "Несовместимая батарея"},
            {"Parallel host lost", "Потерян ведущий инвертор"},
            {"Parallel sync fault", "Сбой синхронизации инверторов"},
            {"Parallel version mismatch", "Версии инверторов различаются"},
            {"Output current offset", "Смещение тока выхода"},
            {"Inverter current offset", "Смещение тока инвертора"},
            {"Battery current offset", "Смещение тока батареи"},
            {"PV current offset", "Смещение тока PV"},
            {"Reserved fault 15", "Резервная ошибка 15"},
            {"Reserved fault 17", "Резервная ошибка 17"},
            {"Overheating", "Перегрев"},
            {"Overload", "Перегрузка"},
            {"Fan blocked", "Вентилятор заблокирован"},
            {"Battery undervoltage", "Недонапряжение батареи"},
            {"Battery voltage low", "Низкое напряжение батареи"},
            {"Battery disconnected", "Батарея отключена"},
            {"Parallel battery mismatch", "Различие батарей в параллели"},
            {"Output derating", "Ограничение мощности выхода"},
            {"Parallel link lost", "Потеряна связь между инверторами"},
            {"Parallel mode mismatch", "Режимы инверторов различаются"},
            {"Mains waveform fault", "Искажение формы напряжения сети"},
            {"Mains undervoltage", "Низкое напряжение сети"},
            {"Mains overfrequency", "Высокая частота сети"},
            {"Mains underfrequency", "Низкая частота сети"},
            {"PV undervoltage", "Низкое напряжение PV"},
            {"Low PV energy", "Мало энергии PV"},
            {"Battery equalizing", "Выравнивание батареи"},
            {"Reserved warning 1", "Резервное предупреждение 1"},
            {"Reserved warning 3", "Резервное предупреждение 3"},

            // Daly alarm labels. Severity prefixes are handled separately.
            {"Charging MOS over-temperature warning", "Перегрев MOSFET заряда"},
            {"Discharging MOS over-temperature warning", "Перегрев MOSFET разряда"},
            {"Charging MOS temperature sensor failure", "Сбой термодатчика MOSFET заряда"},
            {"Discharging MOS temperature sensor failure", "Сбой термодатчика MOSFET разряда"},
            {"Charging MOS adhesion failure", "Залипание MOSFET заряда"},
            {"Discharging MOS adhesion failure", "Залипание MOSFET разряда"},
            {"Charging MOS circuit fault", "Сбой цепи MOSFET заряда"},
            {"Discharging MOS circuit fault", "Сбой цепи MOSFET разряда"},
            {"AFE acquisition chip failure", "Сбой микросхемы AFE"},
            {"Single unit collection is offline", "Нет связи с модулем измерений"},
            {"Single temperature sensor failure", "Сбой термодатчика ячейки"},
            {"EEPROM storage failure", "Сбой EEPROM"},
            {"RTC clock failure", "Сбой часов RTC"},
            {"Precharge failed", "Сбой предзаряда"},
            {"Vehicle communication failed", "Сбой связи с транспортным средством"},
            {"Internal network communication module failure", "Сбой внутреннего модуля связи"},
            {"Reserved", "Резерв"},
            {"Charging current too high", "Высокий ток заряда"},
            {"Discharging current too low", "Низкий ток разряда"},
            {"SOC too high", "Высокий SOC"},
            {"SOC too low", "Низкий SOC"},
            {"Voltage difference too high", "Большой разброс напряжений"},
            {"Temperature difference too high", "Большой разброс температур"},
            {"Cell voltage too high", "Высокое напряжение ячейки"},
            {"Cell voltage too low", "Низкое напряжение ячейки"},
            {"Total voltage too high", "Высокое напряжение батареи"},
            {"Total voltage too low", "Низкое напряжение батареи"},
            {"Charging temperature too high", "Высокая температура при заряде"},
            {"Charging temperature too low", "Низкая температура при заряде"},
            {"Discharging temperature too high", "Высокая температура при разряде"},
            {"Discharging temperature too low", "Низкая температура при разряде"},

            // Operating modes and BLE setup states.
            {"Power On", "Включение"},
            {"Standby", "Ожидание"},
            {"Mains", "От сети"},
            {"Off-Grid", "Автономно"},
            {"Bypass", "Байпас"},
            {"Charging", "Зарядка"},
            {"Fault", "Авария"},
            {"Unknown", "Неизвестно"},
            {"Idle", "Ожидание"},
            {"Discharging", "Разрядка"},
            {"Offline", "Нет связи"},
            {"Scanning...", "Поиск…"},
            {"Scanning for 12 seconds", "Идёт поиск (12 секунд)"},
            {"No Daly found", "Daly не найдена"},
            {"Wake the BMS and scan again", "Активируйте BMS и повторите поиск"},
            {"Select a device number", "Выберите номер устройства"},
            {"Daly saved; scan to replace it", "Daly сохранена. Для замены запустите поиск"},
            {"Scan to find your Daly", "Запустите поиск Daly"},
            {"Connecting; waiting for Daly telemetry", "Подключение. Ожидаем данные Daly"},
            {"BLE disconnect timed out; restart the ESP32 and retry", "BLE не отключился вовремя. Перезапустите ESP32 и повторите"},
            {"BLE disconnect timed out; restart the ESP32", "BLE не отключился вовремя. Перезапустите ESP32"},
            {"No telemetry; the previous Daly choice was kept", "Нет данных. Сохранена прежняя Daly"},
            {"Scan and choose a number from the results", "Запустите поиск и выберите номер из списка"},
        };

        const auto translate_text = [russian](std::string_view text) -> std::string {
          if (!russian)
            return std::string(text);

          constexpr std::string_view saved_prefix = "Saved Daly ";
          if (text.starts_with(saved_prefix))
            return "Сохранена Daly " + std::string(text.substr(saved_prefix.size()));

          std::string_view label = text;
          std::string_view severity;
          if (label.starts_with("Warning: ")) {
            label.remove_prefix(std::string_view("Warning: ").size());
            severity = "Предупреждение: ";
          } else if (label.starts_with("Critical: ")) {
            label.remove_prefix(std::string_view("Critical: ").size());
            severity = "Авария: ";
          }

          for (const auto &entry : translations) {
            if (entry.english == label) {
              std::string translated(severity);
              translated.append(entry.russian);
              return translated;
            }
          }
          return std::string(text);
        };

        if (!is_list)
          return translate_text(text);

        std::string result;
        while (!text.empty()) {
          const auto end = text.find(';');
          auto label = text.substr(0, end);
          if (end == std::string_view::npos)
            text = {};
          else
            text.remove_prefix(end + 1);

          while (!label.empty() && label.front() == ' ')
            label.remove_prefix(1);
          if (label.empty())
            continue;

          const std::string translated = translate_text(label);
          const std::string_view separator = result.empty() ? "" : "; ";
          // Reserve the truncation marker and keep complete UTF-8 labels.
          if (result.size() + separator.size() + translated.size() > 250) {
            result.append(separator);
            result += "...";
            break;
          }
          result.append(separator);
          result += translated;
        }
        return result;
      }

  - id: russian_language
    type: bool
    restore_value: true
    initial_value: "false"

  - id: saved_daly_address
    type: uint64_t
    restore_value: true
    initial_value: "0"
  - id: daly_status_registers
    type: uint8_t
    restore_value: true
    initial_value: "80"
  - id: daly_candidates
    type: std::array<uint64_t, 5>
  - id: daly_scan_results
    type: std::string
    initial_value: '""'

  - id: pv_daily_total
    # Store the calendar date and its kWh together.
    type: std::array<double, 2>
    restore_value: true
    initial_value: "{0, 0}"

  - id: inverter_power_sample_ms
    type: std::array<uint32_t, 4>
    initial_value: "{0, 0, 0, 0}"

  - id: daly_enabled_before_selection
    type: bool
    initial_value: "false"
  - id: daly_enabled_before_ota
    type: bool
    initial_value: "false"

  - id: global_bms_online
    type: bool
    initial_value: "false"

esphome:
  name: anenji-daly
  friendly_name: Gateway
  min_version: 2026.11.0
  comment: ${device_description}
  project:
    name: "alidonet.esphome-bms-inverter"
    version: "1.5.0"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          const uint64_t address = id(saved_daly_address);
          id(language_select).update();
          id(bms0).set_status_registers(id(daly_status_registers));
          id(daly_register_mode).update();
          id(client0).set_address(address);
          id(client0).set_enabled(address != 0);
          id(daly_setup_status).publish_state(address != 0 ? "Daly saved; scan to replace it" : "Scan to find your Daly");
      - select.set:
          id: daly_poll_interval
          option: !lambda return id(daly_poll_interval).current_option().str();
      - select.set:
          id: inverter_poll_interval
          option: !lambda return id(inverter_poll_interval).current_option().str();
  devices:
    - id: device_bms
      name: "Daly"
      relation: via
    - id: device_inverter
      name: "Anenji"
      relation: via
    # - id: device_esp
    #   name: "ESP32 board"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

external_components:
  - source: ${external_components_source}
    refresh: never

wifi:
  ap:
    ssid: "Anenji Daly Setup"
    ap_timeout: 30s
captive_portal:
improv_serial:

ota:
  - platform: esphome
    on_begin: &ota_begin
      then:
        - script.stop: restore_daly_after_ota
        - lambda: |-
            id(daly_enabled_before_ota) = id(connect_daly).is_running()
                ? id(daly_enabled_before_selection) : id(client0).enabled;
        - script.stop: scan_for_daly
        - script.stop: connect_daly
        - switch.turn_off: ble_client_switch0
        - logger.log: "BLE connection suspended for OTA update"
    on_error: &ota_error
      then:
        - script.execute: restore_daly_after_ota
  - platform: web_server
    on_begin: *ota_begin
    on_error: *ota_error

logger:
  level: INFO

web_server:
  version: 3
  local: True
  port: 80
  sorting_groups:
    - id: polling_group
      name: Polling
      sorting_weight: -5
    - id: daly_setup_group
      name: Daly setup
      sorting_weight: -10

# If you use Home Assistant please remove this `mqtt` section and uncomment the `api` component!
# The native API has many advantages over MQTT: https://esphome.io/components/api.html#advantages-over-mqtt
#mqtt:
#  broker: !secret mqtt_ip_address
#  username: !secret mqtt_user
#  password: !secret mqtt_password
#  id: !secret esp_mqtt_topic

api:
  # The local page must keep working when Home Assistant is disconnected.
  reboot_timeout: 0s

light:
  - platform: status_led
    name: "Status LED"
    entity_category: config
    id: led_output
    # device_id: device_esp
    pin: GPIO2

# =================== RS485 ==================

uart:
  - id: uart_0
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

modbus:
  - id: modbus0
    uart_id: uart_0
    send_wait_time: 200ms
    turnaround_time: 200ms

modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: modbus0
    update_interval: ${refresh_inverter}
    offline_skip_updates: 0

interval:
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t expiry = 3u * id(smg0).get_update_interval();
          const uint32_t now = millis();
          const std::array<sensor::Sensor *, 4> powers{
              id(smg0_grid_power), id(smg0_load_power), id(smg0_battery_average_power), id(smg0_pv_average_power)};
          for (size_t i = 0; i < powers.size(); ++i) {
            if (powers[i]->has_state() && std::isfinite(powers[i]->state) &&
                now - id(inverter_power_sample_ms)[i] >= expiry) {
              powers[i]->publish_state(NAN);
            }
          }

script:
  - id: restore_daly_after_ota
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: return id(client0).state() == esp32_ble_tracker::ClientState::IDLE;
          timeout: 12s
      - lambda: |-
          if (id(client0).state() != esp32_ble_tracker::ClientState::IDLE) {
            id(daly_setup_status).publish_state("BLE disconnect timed out; restart the ESP32");
            return;
          }
          const uint64_t address = id(saved_daly_address);
          id(client0).set_address(address);
          id(client0).set_enabled(id(daly_enabled_before_ota) && address != 0);
          id(daly_setup_status).publish_state(address != 0 ? "Daly saved; scan to replace it" : "Scan to find your Daly");

  - id: update_pv_daily_energy
    parameters:
      power: float
    then:
      - lambda: |-
          static uint32_t last_sample_ms = 0;
          static bool has_sample = false;
          const auto date = id(local_time).now();
          if (!date.is_valid()) {
            has_sample = false;
            return;
          }
          const int day = date.year * 10000 + date.month * 100 + date.day_of_month;
          auto &total = id(pv_daily_total);
          if (total[0] != day) {
            total = {static_cast<double>(day), 0.0};
            has_sample = false;
          }
          if (std::isfinite(power)) {
            const uint32_t now = millis();
            const uint32_t elapsed = now - last_sample_ms;
            const uint32_t interval = id(smg0).get_update_interval();
            if (has_sample && elapsed <= interval + interval / 2 && power > 0) {
              total[1] += static_cast<double>(power) * elapsed / 3600000000.0;
            }
            last_sample_ms = now;
            has_sample = true;
          }
          id(pv_energy_today).publish_state(total[1]);

  - id: watch_bms_telemetry
    mode: restart
    then:
      - globals.set:
          id: global_bms_online
          value: "true"
      # Keep the last online state through short BLE interruptions.
      - delay: !lambda return 3u * id(bms0).get_update_interval();
      - globals.set:
          id: global_bms_online
          value: "false"

  - id: scan_for_daly
    then:
      - lambda: |-
          id(daly_candidates).fill(0);
          id(daly_scan_results).clear();
          id(daly_devices_found).publish_state("Scanning...");
          id(daly_setup_status).publish_state("Scanning for 12 seconds");
      - delay: 12s
      - lambda: |-
          const auto &results = id(daly_scan_results);
          id(daly_devices_found).publish_state(results.empty() ? "No Daly found" : results);
          id(daly_setup_status).publish_state(results.empty() ? "Wake the BMS and scan again" : "Select a device number");

  - id: connect_daly
    parameters:
      slot: int
      previous_enabled: bool
    then:
      - lambda: id(daly_enabled_before_selection) = previous_enabled;
      - text_sensor.template.publish:
          id: daly_setup_status
          state: "Connecting; waiting for Daly telemetry"
      - lambda: id(client0).set_enabled(false);
      - wait_until:
          condition:
            lambda: return id(client0).state() == esp32_ble_tracker::ClientState::IDLE;
          timeout: 12s
      - if:
          condition:
            lambda: return id(client0).state() != esp32_ble_tracker::ClientState::IDLE;
          then:
            - text_sensor.template.publish:
                id: daly_setup_status
                state: "BLE disconnect timed out; restart the ESP32 and retry"
            - script.stop: connect_daly
      - script.stop: watch_bms_telemetry
      - globals.set:
          id: global_bms_online
          value: "false"
      - lambda: |-
          id(client0).set_address(id(daly_candidates)[slot]);
          id(client0).set_enabled(true);
      - wait_until:
          condition:
            lambda: return id(global_bms_online);
          timeout: 30s
      - if:
          condition:
            lambda: return id(global_bms_online);
          then:
            - lambda: |-
                id(saved_daly_address) = id(daly_candidates)[slot];
                id(daly_setup_status).publish_state(std::string("Saved Daly ") + id(client0).address_str());
          else:
            - lambda: id(client0).set_enabled(false);
            - wait_until:
                condition:
                  lambda: return id(client0).state() == esp32_ble_tracker::ClientState::IDLE;
                timeout: 12s
            - lambda: |-
                if (id(client0).state() != esp32_ble_tracker::ClientState::IDLE) {
                  id(daly_setup_status).publish_state("BLE disconnect timed out; restart the ESP32");
                  return;
                }
                id(client0).set_address(id(saved_daly_address));
                id(client0).set_enabled(previous_enabled && id(saved_daly_address) != 0);
                id(daly_setup_status).publish_state("No telemetry; the previous Daly choice was kept");

time:
  - platform: sntp
    id: local_time
    timezone: ${timezone}
    on_time_sync:
      - script.execute:
          id: update_pv_daily_energy
          power: !lambda return NAN;
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - script.execute:
              id: update_pv_daily_energy
              power: !lambda return NAN;

# =================== BLE ======================

esp32_ble_tracker:
  scan_parameters:
    active: true
  on_ble_advertise:
    then:
      - lambda: |-
          if (!id(scan_for_daly).is_running())
            return;
          const auto name = x.get_name();
          const auto &services = x.get_service_uuids();
          const auto daly_service = ble_device_base::ESPBTUUID::from_uint16(0xFFF0);
          if (!name.starts_with("DL-") && !name.starts_with("DALY") && !name.starts_with("Daly") &&
              std::find(services.begin(), services.end(), daly_service) == services.end())
            return;
          const uint64_t address = x.address_uint64();
          auto &candidates = id(daly_candidates);
          if (address == 0 || std::find(candidates.begin(), candidates.end(), address) != candidates.end())
            return;
          const auto empty = std::find(candidates.begin(), candidates.end(), 0);
          if (empty == candidates.end())
            return;
          *empty = address;
          std::array<char, MAC_ADDRESS_PRETTY_BUFFER_SIZE> mac;
          x.address_str_to(std::span(mac));
          char entry[54];
          snprintf(entry, sizeof(entry), "%d. %.12s %s (%d dBm)", int(empty - candidates.begin()) + 1,
                   name.empty() ? "BLE" : name.c_str(), mac.data(), x.get_rssi());
          auto &results = id(daly_scan_results);
          if (!results.empty())
            results += " | ";
          results += entry;

ble_client:
  - mac_address: "00:00:00:00:00:00"
    id: client0
    on_connect: 
      then:
        - logger.log:
            format: "BMS BLE connected"
            level: info
    on_disconnect: 
      then:
        - logger.log:
            format: "BMS BLE disconnected"
            level: info

daly_bms_ble:
  - ble_client_id: client0
    id: bms0
    password: 12345678
    # The 80-register reply includes balance current and MOSFET/board temperatures.
    # The web setup can select 62 for firmware that needs the shorter request.
    status_registers: 80
    update_interval: ${refresh_bms}


binary_sensor:

  - platform: template
    name: "Online"
    entity_category: diagnostic
    device_id: device_bms
    device_class: connectivity
    lambda: !lambda |-
      return (id(global_bms_online));

  - platform: template
    name: "Online"
    entity_category: diagnostic
    device_id: device_inverter
    device_class: connectivity
    lambda: !lambda |-
      return id(smg0_grid_power).has_state() && std::isfinite(id(smg0_grid_power).state);

# ============== ble ===========

  - platform: daly_bms_ble
    daly_bms_ble_id: bms0
    balancing:
      name: "Balancing"
      device_id: device_bms
    charging:
      name: "Charging"
      device_id: device_bms
    discharging:
      name: "Discharging"
      device_id: device_bms

button:

  - platform: template
    name: "Find Daly"
    entity_category: config
    web_server:
      sorting_group_id: daly_setup_group
      sorting_weight: 10
    on_press:
      - if:
          condition:
            and:
              - not:
                  script.is_running: connect_daly
              - not:
                  script.is_running: restore_daly_after_ota
          then:
            - script.execute: scan_for_daly

# ====== rs485 ========

  # Exit the fault mode                                           Uint  426   W   1: Exit the fault state
  - platform: template
    name: "Clear fault"
    entity_category: config
    device_id: device_inverter
    icon: mdi:restore
    on_press:
      then:
        - modbus_client.write_multiple_registers:
            modbus_id: modbus0
            address: 0x01
            start_address: 426
            values: [1]

# ========= ble =======

  - platform: daly_bms_ble
    daly_bms_ble_id: bms0
    # Retrieves the BMS settings and prints them in the ESPHome logs
    retrieve_settings:
      name: "Log settings"
      entity_category: config
      device_id: device_bms
    # Restarts the BMS
    restart:
      name: "Restart"
      entity_category: config
      device_id: device_bms
    # # Shuts down the BMS
    # shutdown:
    #   name: "Shutdown"
      # device_id: device_bms
    # # Resets the BMS to the factory settings
