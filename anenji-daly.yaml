      sorting_group_id: daly_setup_group
      sorting_weight: 20

  - platform: template
    id: daly_setup_status
    name: "Daly setup status"
    filters:
      - lambda: return id(translate_state)(x, id(russian_language), false);
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: daly_setup_group
      sorting_weight: 40

# ===== rs485 ======

  # Fault code                                                    ULong 100 2 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Fault"
    id: inverter_fault_text
    filters:
      - lambda: return id(translate_state)(x, id(russian_language), true);
    entity_category: diagnostic
    device_id: device_inverter
    address: 100
    register_type: holding
    response_size: 4
    raw_encode: HEXBYTES
    icon: mdi:alert-circle
    lambda: |-
      // Most urgent flags first. Bit positions match the register map.
      static constexpr struct { uint8_t bit; const char *label; } messages[] = {
          {4, "Output short circuit"},  // 0000 0000 0000 0000 0000 0000 0001 0000 (5)
          {2, "Battery overvoltage"},  // 0000 0000 0000 0000 0000 0000 0000 0100 (3)
          {11, "Battery overcurrent"},  // 0000 0000 0000 0000 0000 1000 0000 0000 (12)
          {7, "DC bus overvoltage"},  // 0000 0000 0000 0000 0000 0000 1000 0000 (8)
          {5, "Inverter overvoltage"},  // 0000 0000 0000 0000 0000 0000 0010 0000 (6)
          {12, "Inverter overcurrent"},  // 0000 0000 0000 0000 0001 0000 0000 0000 (13)
          {10, "PV overvoltage"},  // 0000 0000 0000 0000 0000 0100 0000 0000 (11)
          {9, "PV overcurrent"},  // 0000 0000 0000 0000 0000 0010 0000 0000 (10)
          {0, "Inverter overheat"},  // 0000 0000 0000 0000 0000 0000 0000 0001 (1)
          {1, "DC/DC overheat"},  // 0000 0000 0000 0000 0000 0000 0000 0010 (2)
          {3, "PV overheat"},  // 0000 0000 0000 0000 0000 0000 0000 1000 (4)
          {6, "Output overload"},  // 0000 0000 0000 0000 0000 0000 0100 0000 (7)
          {15, "Excess inverter DC offset"},  // 0000 0000 0000 0000 1000 0000 0000 0000 (16)
          {13, "DC bus undervoltage"},  // 0000 0000 0000 0000 0010 0000 0000 0000 (14)
          {21, "Inverter undervoltage"},  // 0000 0000 0010 0000 0000 0000 0000 0000 (22)
          {22, "Reverse inverter power"},  // 0000 0000 0100 0000 0000 0000 0000 0000 (23)
          {8, "DC bus start timeout"},  // 0000 0000 0000 0000 0000 0001 0000 0000 (9)
          {25, "Incompatible battery"},  // 0000 0010 0000 0000 0000 0000 0000 0000 (26)
          {23, "Parallel host lost"},  // 0000 0000 1000 0000 0000 0000 0000 0000 (24)
          {24, "Parallel sync fault"},  // 0000 0001 0000 0000 0000 0000 0000 0000 (25)
          {26, "Parallel version mismatch"},  // 0000 0100 0000 0000 0000 0000 0000 0000 (27)
          {17, "Output current offset"},  // 0000 0000 0000 0010 0000 0000 0000 0000 (18)
          {18, "Inverter current offset"},  // 0000 0000 0000 0100 0000 0000 0000 0000 (19)
          {19, "Battery current offset"},  // 0000 0000 0000 1000 0000 0000 0000 0000 (20)
          {20, "PV current offset"},  // 0000 0000 0001 0000 0000 0000 0000 0000 (21)
          {14, "Reserved fault 15"},  // 0000 0000 0000 0000 0100 0000 0000 0000 (15)
          {16, "Reserved fault 17"},  // 0000 0000 0000 0001 0000 0000 0000 0000 (17)
      };
      const uint32_t mask = modbus::helpers::dword_from_hex_str(x, 0);
      std::string values;
      for (const auto &[bit, label] : messages) {
        if (!(mask & (1u << bit)))
          continue;
        // Reserve five characters for the suffix if lower-priority flags are omitted.
        if (values.size() + (values.empty() ? 0 : 2) + strlen(label) > 250) {
          values.append("; ...");
          break;
        }
        if (!values.empty())
          values.append("; ");
        values.append(label);
      }
      return values;

  # Warning code                                                  ULong 108 2 R
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Warning"
    id: inverter_warning_text
    filters:
      - lambda: return id(translate_state)(x, id(russian_language), true);
    entity_category: diagnostic
    device_id: device_inverter
    address: 108
    register_type: holding
    response_size: 4
    raw_encode: HEXBYTES
    icon: mdi:alert-circle
    lambda: |-
      // Most urgent flags first. Bit positions match the register map.
      static constexpr struct { uint8_t bit; const char *label; } messages[] = {
          {7, "Overheating"},  // 0000 0000 0000 0000 0000 0000 1000 0000 (8)
          {10, "Overload"},  // 0000 0000 0000 0000 0000 0100 0000 0000 (11)
          {14, "Fan blocked"},  // 0000 0000 0000 0000 0100 0000 0000 0000 (15)
          {12, "Battery undervoltage"},  // 0000 0000 0000 0000 0001 0000 0000 0000 (13)
          {8, "Battery voltage low"},  // 0000 0000 0000 0000 0000 0001 0000 0000 (9)
          {9, "Battery disconnected"},  // 0000 0000 0000 0000 0000 0010 0000 0000 (10)
          {18, "Parallel battery mismatch"},  // 0000 0000 0000 0100 0000 0000 0000 0000 (19)
          {13, "Output derating"},  // 0000 0000 0000 0000 0010 0000 0000 0000 (14)
          {16, "Parallel link lost"},  // 0000 0000 0000 0001 0000 0000 0000 0000 (17)
          {17, "Parallel mode mismatch"},  // 0000 0000 0000 0010 0000 0000 0000 0000 (18)
          {1, "Mains waveform fault"},  // 0000 0000 0000 0000 0000 0000 0000 0010 (2)
          {3, "Mains undervoltage"},  // 0000 0000 0000 0000 0000 0000 0000 1000 (4)
          {4, "Mains overfrequency"},  // 0000 0000 0000 0000 0000 0000 0001 0000 (5)
          {5, "Mains underfrequency"},  // 0000 0000 0000 0000 0000 0000 0010 0000 (6)
          {6, "PV undervoltage"},  // 0000 0000 0000 0000 0000 0000 0100 0000 (7)
          {15, "Low PV energy"},  // 0000 0000 0000 0000 1000 0000 0000 0000 (16)
          {11, "Battery equalizing"},  // 0000 0000 0000 0000 0000 1000 0000 0000 (12)
          {0, "Reserved warning 1"},  // 0000 0000 0000 0000 0000 0000 0000 0001 (1)
          {2, "Reserved warning 3"},  // 0000 0000 0000 0000 0000 0000 0000 0100 (3)
      };
      const uint32_t mask = modbus::helpers::dword_from_hex_str(x, 0);
      std::string values;
      for (const auto &[bit, label] : messages) {
        if (!(mask & (1u << bit)))
          continue;
        // Reserve five characters for the suffix if lower-priority flags are omitted.
        if (values.size() + (values.empty() ? 0 : 2) + strlen(label) > 250) {
          values.append("; ...");
          break;
        }
        if (!values.empty())
          values.append("; ");
        values.append(label);
      }
      return values;

  # Operation Mode                                                UInt  201 1 R 0: Power On, 1: Standby, 2: Mains, 3: Off-Grid, 4: Bypass, 5: Charging, 6: Fault
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Mode"
    id: inverter_mode_text
    filters:
      - lambda: return id(translate_state)(x, id(russian_language), false);
    device_id: device_inverter
    address: 201
    register_type: holding
    raw_encode: HEXBYTES
    icon: mdi:information
    lambda: |-
      uint16_t value = modbus::helpers::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("Power On");
        case 1: return std::string("Standby");
        case 2: return std::string("Mains");
        case 3: return std::string("Off-Grid");
        case 4: return std::string("Bypass");
        case 5: return std::string("Charging");
        case 6: return std::string("Fault");
      }
      return std::string("Unknown");

  # Operation Mode                                                UInt  201 1 R 0: Power On, 1: Standby, 2: Mains, 3: Off-Grid, 4: Bypass, 5: Charging, 6: Fault
# ======== ble =======

  - platform: daly_bms_ble
    daly_bms_ble_id: bms0
    battery_status:
      name: "Status"
      id: daly_battery_status_text
      filters:
        - lambda: return id(translate_state)(x, id(russian_language), false);
      device_id: device_bms
    # The component decodes this text directly from the original 64-bit mask.
    errors:
      name: "Errors"
      id: daly_errors_text
      filters:
        - lambda: return id(translate_state)(x, id(russian_language), true);
      entity_category: diagnostic
      device_id: device_bms


select:

  - platform: template
    id: daly_poll_interval
    name: "Daly poll interval"
    entity_category: config
    options: &poll_intervals ["5 s", "10 s", "15 s", "20 s", "30 s", "45 s", "60 s", "90 s", "120 s"]
    initial_option: "30 s"
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: polling_group
    set_action:
      - lambda: |-
          const uint32_t interval_ms = std::strtoul(x.c_str(), nullptr, 10) * 1000u;
          if (interval_ms == id(bms0).get_update_interval())
            return;
          id(bms0).stop_poller();
          id(bms0).set_update_interval(interval_ms);
          id(bms0).start_poller();

  - platform: template
    id: inverter_poll_interval
    name: "Inverter poll interval"
    entity_category: config
    options: *poll_intervals
    initial_option: "20 s"
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: polling_group
    set_action:
      - lambda: |-
          const uint32_t interval_ms = std::strtoul(x.c_str(), nullptr, 10) * 1000u;
          if (interval_ms == id(smg0).get_update_interval())
            return;
          id(smg0).stop_poller();
          id(smg0).set_update_interval(interval_ms);
          id(smg0).start_poller();

  - platform: template
    id: language_select
    name: "Language"
    entity_category: config
    options: ["English", "Русский"]
    update_interval: never
    lambda: |-
      return std::string(id(russian_language) ? "Русский" : "English");
    web_server:
      sorting_group_id: daly_setup_group
      sorting_weight: 0
    set_action:
      - lambda: |-
          id(russian_language) = x == "Русский";
          id(language_select).update();
          for (auto *sensor : std::initializer_list<text_sensor::TextSensor *>{
                   id(inverter_mode_text), id(inverter_fault_text), id(inverter_warning_text),
                   id(daly_battery_status_text), id(daly_errors_text), id(daly_setup_status),
                   id(daly_devices_found)}) {
            if (sensor->has_state()) {
              const std::string raw = sensor->get_raw_state();
              sensor->publish_state(raw);
            }
          }

  - platform: template
    id: daly_register_mode
    name: "Daly telemetry mode"
    entity_category: config
    options: ["80 registers", "62 registers"]
    update_interval: never
    lambda: |-
      return id(daly_status_registers) == 62 ? std::string("62 registers") : std::string("80 registers");
    web_server:
      sorting_group_id: daly_setup_group
      sorting_weight: 5
    set_action:
      - lambda: |-
          if (!id(connect_daly).is_running()) {
            id(daly_status_registers) = x == "62 registers" ? 62 : 80;
            id(bms0).set_status_registers(id(daly_status_registers));
          }
          id(daly_register_mode).update();

  - platform: template
    id: daly_device_choice
    name: "Daly device"
    entity_category: config
    options: ["Choose a number", "1", "2", "3", "4", "5"]
    web_server:
      sorting_group_id: daly_setup_group
      sorting_weight: 30
    set_action:
      - lambda: |-
          if (x.size() != 1 || x[0] < '1' || x[0] > '5')
            return;
          if (id(scan_for_daly).is_running() || id(connect_daly).is_running() || id(restore_daly_after_ota).is_running())
            return;
          const size_t slot = x[0] - '1';
          id(daly_device_choice).publish_state("Choose a number");
          if (id(daly_candidates)[slot] == 0) {
            id(daly_setup_status).publish_state("Scan and choose a number from the results");
            return;
          }
          id(connect_daly).execute(slot, id(client0).enabled);

# ========= rs485 =========

  # Output Mode                                                   Uint  300 1 R/W 0: Single, 1: Parallel, 2: 3 Phase-P1, 3: 3 Phase-P2, 4: 3 Phase-P3
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Output mode"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 300
    value_type: U_WORD
    icon: mdi:cog
    optionsmap:
      "Single": 0
      "Parallel": 1
      "Phase P1": 2
      "Phase P2": 3
      "Phase P3": 4

  # Output priority                                               Uint  301 1 R/W 0: Utility-PV-Battery, 1: PV-Utility-Battery, 2: PV-Battery-Utility
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Output priority"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 301
    value_type: U_WORD
    icon: mdi:cog
    optionsmap:
      "Utility-PV-Battery (UTI)": 0
      "PV-Utility-Battery (SOL)": 1
      "PV-Battery-Utility (SBU)": 2
      "PV-Utility-Battery (SUB)": 3

  # Input voltage range                                           Uint  302 1 R/W 0: Wide range, 1: Narrow range
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Input voltage range"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 302
    value_type: U_WORD
    icon: mdi:cog
    optionsmap:
      "Wide range": 0
      "Narrow range": 1

  # Buzzer mode                                                   Uint  303 1 R/W 0: Mute in all situations, 1: Sound when the input source is changed or there is a specific warning or fault, 2: Sound when there is aspecific warning or fault, 3: Sound when fault occurs
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Buzzer mode"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 303
    value_type: U_WORD
    icon: mdi:cog
    optionsmap:
      "Silent": 0
      "Beep on input source changes, warnings and faults": 1
      "Beep on warnings and faults": 2
      "Beep on faults": 3

  # LCD backlight                                                 Uint  305 1 R/W 0: Timed off, 1: Always on
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Lcd backlight"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 305
    value_type: U_WORD
    icon: mdi:cog
    optionsmap:
      "Timed off": 0
      "Always on": 1

  # Battery charging priority                                     Uint  331 1 R/W 0: Utility priority, 1: PV priority, 2: PV is at the same level as the Utility, 3: Only PV charging is allowed
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Charge priority"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 331
    value_type: U_WORD
    icon: mdi:cog
    optionsmap:
      "Utility priority": 0
      "PV priority": 1
      "PV is at the same level as the Utility": 2
      "Only PV charging is allowed": 3

  # Turn on mode                                                  Uint  406 1 R/W 0: Can be turn-on locally or remotely, 1: Only local turn-on, 2: Only remote turn-on
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Power-on mode"
    entity_category: config
    disabled_by_default: true
    device_id: device_inverter
    use_write_multiple: true
    address: 406
    value_type: U_WORD
    icon: mdi:cog
    optionsmap:
      "Local and remotely turn-on allowed": 0
      "Local turn-on only": 1
      "Remote turn-on only": 2

  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Battery type"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 322
    value_type: U_WORD
    icon: mdi:cog
    optionsmap:
      "AGM": 0
      "FLD": 1
      "USER": 2
      "Li1": 3
      "Li2": 4
      "Li3": 5
      "Li4": 6
      "Lib": 8


