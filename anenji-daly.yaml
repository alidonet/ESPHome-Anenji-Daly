number:
# ====== rs485 ======

  # AC and charging limits below refer to the ANJ-4.2KW-24V-WIFI manual.
  # Output voltage                                                0.1V    Uint  320 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Output voltage setpoint"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 320
    register_type: holding
    value_type: U_WORD
    min_value: 220
    max_value: 240
    step: 10
    unit_of_measurement: "V"
    icon: mdi:cog
    lambda: "return x * 0.1f;"
    write_lambda: |-
      if (x != 220 && x != 230 && x != 240)
        return {};
      return x * 10.0f;

  # Output frequency setting                                      0.01Hz  Uint  321 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Output frequency setpoint"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 321
    register_type: holding
    value_type: U_WORD
    min_value: 50
    max_value: 60
    step: 10
    unit_of_measurement: "Hz"
    icon: mdi:cog
    lambda: "return x * 0.01f;"
    write_lambda: |-
      if (x != 50 && x != 60)
        return {};
      return x * 100.0f;

  # Battery overvoltage protection point                          0.1V    Uint  323 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Battery overvoltage limit"
    entity_category: config
    disabled_by_default: true
    device_id: device_inverter
    use_write_multiple: true
    address: 323
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    icon: mdi:battery-high
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Max charging voltage                                          0.1V    Uint  324 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Bulk charge voltage"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 324
    register_type: holding
    value_type: U_WORD
    # The battery profile and float voltage may narrow this envelope.
    min_value: 24.0
    max_value: 31.0
    step: 0.1
    unit_of_measurement: "V"
    icon: mdi:battery-high
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Floating charging voltage                                     0.1V    Uint  325 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Float voltage"
    entity_category: config
    device_id: device_inverter
    use_write_multiple: true
    address: 325
    register_type: holding
    value_type: U_WORD
    # The configured bulk voltage is the actual upper limit.
    min_value: 24.0
    max_value: 31.0
    step: 0.1
    unit_of_measurement: "V"
    icon: mdi:battery
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery discharge recovery point in mains mode                0.1V    Uint  326 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Battery recovery voltage"
    entity_category: config
    disabled_by_default: true
    device_id: device_inverter
    use_write_multiple: true
    address: 326
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    icon: mdi:battery-low
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery low voltage protection point in mains mode            0.1V    Uint  327 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Low voltage limit (mains)"
    entity_category: config
    disabled_by_default: true
    device_id: device_inverter
    use_write_multiple: true
    address: 327
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    icon: mdi:battery-low
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Battery low voltage protection point in off-grid mode          0.1V           Uint  329 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
    name: "Low voltage limit (off-grid)"
    entity_category: config
    disabled_by_default: true
    device_id: device_inverter
    use_write_multiple: true
    address: 329
    register_type: holding
    value_type: U_WORD
    min_value: 0.0
    # max_value: 100.0
    step: 0.1
    unit_of_measurement: "V"
    icon: mdi:battery-low
    lambda: "return x * 0.1f;"
    write_lambda: |-
      return x * 10.0f;

  # Maximum charging current                                      0.1A    Uint  332 1 R/W
  - platform: modbus_controller
    modbus_controller_id: smg0
